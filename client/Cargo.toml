[package]
name = "client"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
strip = true
debug = false
codegen-units = 1
debug-assertions = false
panic = "abort"

[package.metadata.cargo-post.dependencies]
regex = "1.11.1"
memmap2 = "0.9.5"
walkdir = "2.5.0"
rand = "0.8.5"

[build-dependencies]
rand = "0.8.5"

[dependencies]
tokio = { version = "1.43.0", features = ["full"] }
shared = { path = "../shared" }
client_vars = { path = "../client_vars" }
lazy_static = "1.5.0"
obfstr = "0.4.4"
anyhow = "1.0.95"
winreg = "0.55.0"
wmi = "0.14.4"
serde = "1.0.217"
winapi = { version = "0.3.9", features = [
    # "processthreadsapi",
    # "securitybaseapi",
    # "windef",
    # "psapi",
    # "shellapi",
    # "winuser",
    # "winbase",
    # "winerror",
    # "errhandlingapi",
    # "handleapi",
    # "tlhelp32",
    # "winsvc",
    # "debugapi",
    "memoryapi",
] }
serde_json = "1.0.136"
sysinfo = "0.33.1"
screenshots = "0.8.10"
reqwest = "0.12.12"
futures = "0.3.31"
