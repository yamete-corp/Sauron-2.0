[package]
name = "client_vars"
version = "0.1.0"
edition = "2021"

[lib]
name = "client_vars"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
debug = false
codegen-units = 1
debug-assertions = false
panic = "abort"

[build-dependencies]
rand = "0.8"

[dependencies]
obfstr = "0.4"
serde = "1"
shared = { path = "../shared" }
