[package]
name = "loader"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
strip = true
debug = false
codegen-units = 1
debug-assertions = false
incremental = false
panic = "abort"

[build-dependencies]
rand = "0.8.5"

[package.metadata.cargo-post.dependencies]
regex = "1.11.1"
memmap2 = "0.9.5"
walkdir = "2.5.0"
rand = "0.8.5"

[dependencies]
lazy_static = "1.5.0"
windows-service = "0.7.0"
windows-service-detector = "0.1.0"
shared = { path = "../shared" }
loader_vars = { path = "../loader_vars" }
obfstr = "0.4.4"
anyhow = "1.0.95"
serde_json = "1.0.137"
tokio = "1.43.0"
serde = "1"
