[package]
name = "server-ui"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2.80"
wasm-bindgen-futures = "0.4.2"
web-sys = "0.3.2"
js-sys = "0.3.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6.2"
console_error_panic_hook = "0.1.2"
server_vars = { path = "../server_vars" }
# yew-hooks = "0.3.3"
# serde_json = "1"

[workspace]
members = ["src-tauri"]
